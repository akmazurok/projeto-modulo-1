<div class="main-panel">

    @switch (page$ | async) {
    @case (pages.DASHBOARD) {
    <app-dashboard></app-dashboard>
    }
    @case (pages.TRANSACTIONS) {
    <app-transactions-list></app-transactions-list>
    }
    @case (pages.LOAN) {
    <app-loan></app-loan>
    }
    @case (pages.TRANSFER) {
    <app-transfers></app-transfers>
    }
    @default {
    <app-dashboard></app-dashboard>
    }
    }

</div>
