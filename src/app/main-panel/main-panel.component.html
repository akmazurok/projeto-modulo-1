<div class="main-panel">

    @switch (page$ | async) {
    @case (pages.DASHBOARD) {
    <app-dashboard></app-dashboard>
    }
    @case (pages.TRANSACTIONS) {
    <app-transactions-list></app-transactions-list>
    }
    @case (pages.CREDIT) {
    <app-credit></app-credit>
    }
    @case (pages.EXTRACT) {
    <app-extract></app-extract>
    }
    @default {
    <app-dashboard></app-dashboard>
    }
    }

</div>
