<div>
  @if (id) {
  <h4 class="mb-4">Editar Transação</h4>
  } @else {
  <h4 class="mb-4">Criar Transação</h4>
  }
  <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">

    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Descrição</mat-label>
      <input matInput formControlName="description" placeholder="Descreva a transação">
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Valor</mat-label>
      <input matInput placeholder="Valor da transação" formControlName="amount" currencyMask
        [currencyMask]="currencyOptions" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Tipo</mat-label>

      <mat-select formControlName="type">
        <mat-option [value]="null" selected>- Selecione</mat-option>
        <mat-option [value]="transactionTypesEnum.INCOME">Entrada</mat-option>
        <mat-option [value]="transactionTypesEnum.EXPENSE">Saída</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Data</mat-label>
      <input matInput formControlName="date" [matDatepicker]="picker">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <div class="mt-3">
      <button type="submit" class="btn btn-primary me-2" [disabled]="transactionForm.invalid">
        Salvar
      </button>
      <button type="button" class="btn btn-outline-primary" (click)="backToList()">
        Voltar
      </button>
    </div>
  </form>
</div>
