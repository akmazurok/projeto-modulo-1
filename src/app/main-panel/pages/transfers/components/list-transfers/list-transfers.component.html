<div class="row">
    <h4>Transferências</h4>
    <div class="mb-3">
        <button class="btn btn-primary" (click)="redirectToCreate()">
            Nova Transferência
        </button>
    </div>
    <div class="col">

        <table mat-table [dataSource]="dataSource">

            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef> Data </th>
                <td mat-cell *matCellDef="let t">
                    {{ t.date | date:'dd/MM/yyyy' }}
                </td>
            </ng-container>

            <ng-container matColumnDef="toAccountId">
                <th mat-header-cell *matHeaderCellDef> Destino </th>
                <td mat-cell *matCellDef="let t">
                    {{ t.toAccountId | accountMask}}
                </td>
            </ng-container>

            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef> Descrição </th>
                <td mat-cell *matCellDef="let t">
                    {{ t.description }}
                </td>
            </ng-container>

            <ng-container matColumnDef="amount">
                <th mat-header-cell *matHeaderCellDef> Valor </th>
                <td mat-cell *matCellDef="let t" class="text-danger">
                    {{ t.amount | signedValue: "expense" | currency }}
                </td>
            </ng-container>


            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator [pageSize]="6" [pageSizeOptions]="[6, 12]" showFirstLastButtons>
        </mat-paginator>


    </div>
</div>
