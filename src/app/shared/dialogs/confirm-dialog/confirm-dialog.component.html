<h2 mat-dialog-title class="dialog-title">
    <mat-icon [class]="iconColor">{{ icon }}</mat-icon>
    {{ data.title }}
</h2>

<mat-dialog-content>
    {{ data.message }}
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
    <button type="button" class="btn btn-light" (click)="cancel()">
        {{ data.cancelText }}
    </button>

    <button type="button" [class]="buttonColor" (click)="confirm()">
        {{ data.confirmText}}
    </button>
</mat-dialog-actions>
